# Builds and tests on every push and pull request.
# Every push to main also publishes a GitHub Release with a plain APK attached,
# which is what you install on the Fold (or what Obtainium watches for updates).
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Caches Gradle downloads between runs, so builds after the first are much faster.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Output is also saved to build.log so a failure can be reported (last step).
      # `set -o pipefail`: without it, "gradlew | tee" reports tee's success even when
      # Gradle fails, and CI shows a green step for a broken build.
      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee -a build.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a build.log

      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN: ${{ github.run_number }}
        run: |
          set -o pipefail
          cp app/build/outputs/apk/debug/app-debug.apk "hometodo-$RUN.apk"
          gh release create "build-$RUN" "hometodo-$RUN.apk" \
            --title "Build $RUN" \
            --notes "${COMMIT_MSG:-Manual build}" \
            --target "$GITHUB_SHA" 2>&1 | tee -a build.log

      # On failure, post the compiler errors and failed test messages as a comment on the
      # commit, so they're readable from the GitHub app (and by tools that can't open logs).
      - name: Report failure on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Build failed"
            echo '```'
            grep -E "^e: |^w: .*error|What went wrong|FAILED|Exception|Caused by" build.log | head -60 || true
            for f in $(find app/build/test-results -name '*.xml' 2>/dev/null); do
              grep -o '<testcase name="[^"]*"\|<failure message="[^"]*"' "$f" | grep -B1 '<failure' || true
            done | head -40
            echo "--- last lines ---"
            tail -25 build.log || true
            echo '```'
          } > report.md
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@report.md
