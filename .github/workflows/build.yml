# Builds and tests on every push and pull request.
# Every push to main also publishes a GitHub Release with a plain APK attached,
# which is what you install on the Fold (or what Obtainium watches for updates).
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Caches Gradle downloads between runs, so builds after the first are much faster.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN: ${{ github.run_number }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "hometodo-$RUN.apk"
          gh release create "build-$RUN" "hometodo-$RUN.apk" \
            --title "Build $RUN" \
            --notes "${COMMIT_MSG:-Manual build}" \
            --target "$GITHUB_SHA"
